<style>
  :root{
    --navy:#10143a;
    --navy-2:#171c4d;
    --navy-3:#222a66;
    --glow:#34408c;
    --yellow:#f4e04d;
    --yellow-d:#c9b52a;
    --ink:#f5f3ea;

    --red:#e2563f;

  }

  .crew::before{content:"";position:absolute;left:50%;top:52%;width:min(120vw,560px);aspect-ratio:1;transform:translate(-50%,-50%);

  .crew img{position:relative;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
  #splash h1{margin:12px 0 0;font:400 clamp(30px,8.6vw,40px)/1.1 var(--f-head);color:#fff;letter-spacing:.005em}

  .btn-yellow:active{transform:scale(.98);filter:brightness(.95)}
  .btn-yellow:disabled{opacity:.45}

    border-top:1px solid rgba(255,255,255,.06);transition:background .15s}

  .clear-all{display:block;margin:26px auto 0;padding:10px 18px;color:var(--muted);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}

  /* כפתור "שלח לדור" */

    background:linear-gradient(180deg,#f8e866,var(--yellow));color:var(--navy);text-align:right;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 28px rgba(0,0,0,.35);transition:transform .12s,filter .12s,opacity .2s}

  .btn-send .wa{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--navy)}

  .btn-send .lbl{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}

    background:rgba(16,20,58,.1);font:700 15px/1 var(--f-body);font-variant-numeric:tabular-nums}

    border:1px solid rgba(255,255,255,.16);color:var(--ink);font:500 14px/1 var(--f-body)}

<script>
(() => {
  const $ = id => document.getElementById(id);
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#10143a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></svg>';
  const PEN = '<svg class="pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';

  // מפתחות שמירה בטלפון
  const KEY = 'p4p-missing-v1';        // מה סומן כחסר
  const CAT_KEY = 'p4p-catalog-v1';    // רשימת המוצרים (אחרי עריכה של אודי)
  const LANG_KEY = 'p4p-lang';         // שפה
  const SENT = 'p4p-sent-at';          // מתי נשלחה הודעה לדור
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  /* --- תמונות --- */
  $('logo').src = IMG_LOGO; $('logoSmall').src = IMG_LOGO; $('crew').src = IMG_CREW;
  $('ninja').href = GAME_URL;
  // אם תמונה לא נטענת (אין קליטה) – מסתירים אותה במקום להציג אייקון שבור
  document.querySelectorAll('img').forEach(i => i.addEventListener('error', () => { i.style.visibility = 'hidden'; }));

  /* --- שפה: עברית / ערבית --- */
  const T = {
    he: {
      langBtn: 'عربي', langBtnLabel: 'التبديل إلى العربية',
      splashTitle: 'מה חסר היום?', splashSub: 'מסמנים, שולחים לדור, וחוזרים לתנור', start: 'מתחילים',
      invTitle: 'מה חסר?', ninja: "פיצה נינג'ה", ninjaShort: "נינג'ה", send: 'שלח לדור', sendSub: 'בוואטסאפ, עם התאריך', musicOn: 'מוזיקה: פועלת', musicOff: 'מוזיקה: כבויה', clearAll: 'ניקוי כל הסימונים',
      missingN: n => `${n} חסרים`,
      sentT: 'נשלח לדור?', sentP: 'לנקות את הסימונים ולהתחיל רשימה חדשה?',
      clearT: 'לנקות הכל?', clearP: 'כל הסימונים יימחקו.',
      yes: 'כן, לנקות', no: 'לא, להשאיר',
      nothing: 'עוד לא סימנת שום דבר', cleared: 'נוקה! רשימה חדשה',
      msgTitle: 'מה חסר – Pizza For The People', msgTotal: n => `סה״כ ${n} פריטים`,
      locale: 'he-IL', title: 'מה חסר? · Pizza For The People',
      // עריכה
      editList: 'עריכת הרשימה', editTitle: 'עריכת הרשימה', editSaved: 'השינויים נשמרים בטלפון', done: 'סיום',
      editHint: 'לוחצים על מוצר או על שם קטגוריה כדי לשנות או למחוק.',
      addItem: 'הוספת מוצר', addCat: 'קטגוריה חדשה', reset: 'חזרה לרשימה המקורית',
      newItem: 'מוצר חדש', editItem: 'עריכת מוצר', newCat: 'קטגוריה חדשה', editCat: 'עריכת קטגוריה',
      inHe: 'בעברית', inAr: 'בערבית', save: 'שמירה', cancel: 'ביטול',
      delItem: 'מחיקת המוצר', delCat: 'מחיקת הקטגוריה וכל המוצרים בה', sure: 'בטוח? לחיצה נוספת מוחקת',
      needName: 'צריך לכתוב שם לפחות בשפה אחת', noTr: 'אין תרגום', emptyCat: 'אין מוצרים',
      saved: 'נשמר ✓', deleted: 'נמחק',
      resetT: 'לחזור לרשימה המקורית?', resetP: 'כל השינויים שעשית ברשימה יימחקו.', resetYes: 'כן, לחזור', resetNo: 'לא',
      resetDone: 'הרשימה חזרה למקור',
    },
    ar: {
      langBtn: 'עברית', langBtnLabel: 'מעבר לעברית',
      splashTitle: 'شو ناقص اليوم؟', splashSub: 'بنعلّم، بنبعت لدور، وبنرجع عالفرن', start: 'يلّا نبلّش',
      invTitle: 'شو ناقص؟', ninja: 'بيتسا نينجا', ninjaShort: 'نينجا', send: 'ابعث لدور', sendSub: 'عالواتساب، مع التاريخ', musicOn: 'موسيقى: شغّالة', musicOff: 'موسيقى: طافية', clearAll: 'امسح كل العلامات',
      missingN: n => `ناقص ${n}`,
      sentT: 'انبعتت لدور؟', sentP: 'نمسح العلامات ونبلّش قائمة جديدة؟',
      clearT: 'نمسح كل إشي؟', clearP: 'كل العلامات رح تنمسح.',
      yes: 'آه، امسح', no: 'لا، خلّيها',
      nothing: 'لسّا ما علّمت ولا إشي', cleared: 'انمسحت! قائمة جديدة',
      msgTitle: 'شو ناقص – Pizza For The People', msgTotal: n => `المجموع ${n}`,
      locale: 'ar', title: 'شو ناقص؟ · Pizza For The People',
      // تعديل
      editList: 'تعديل القائمة', editTitle: 'تعديل القائمة', editSaved: 'التغييرات بتنحفظ عالتلفون', done: 'خلص',
      editHint: 'اضغط على منتج أو على اسم القسم عشان تغيّر أو تمسح.',
      addItem: 'زيد منتج', addCat: 'قسم جديد', reset: 'رجّع القائمة الأصلية',
      newItem: 'منتج جديد', editItem: 'تعديل منتج', newCat: 'قسم جديد', editCat: 'تعديل قسم',
      inHe: 'بالعبري', inAr: 'بالعربي', save: 'احفظ', cancel: 'إلغاء',
      delItem: 'امسح المنتج', delCat: 'امسح القسم وكل المنتجات اللي فيه', sure: 'متأكد؟ اضغط كمان مرة للمسح',
      needName: 'لازم تكتب اسم بلغة وحدة على الأقل', noTr: 'ما في ترجمة', emptyCat: 'ما في منتجات',
      saved: 'انحفظ ✓', deleted: 'انمسح',
      resetT: 'نرجّع القائمة الأصلية؟', resetP: 'كل التغييرات اللي عملتها رح تنمسح.', resetYes: 'آه، رجّعها', resetNo: 'لا',
      resetDone: 'رجعت القائمة الأصلية',
    },
  };
  let lang = store.get(LANG_KEY) === 'ar' ? 'ar' : 'he';
  const t = k => T[lang][k];
  const other = l => (l === 'ar' ? 'he' : 'ar');
  // שם בשפה המבוקשת; אם אין – בשפה השנייה
  const nm = (o, l = lang) => (o[l] || o[other(l)] || '').trim();

  /* --- רשימת המוצרים: מהטלפון (אם אודי ערך) או מהקוד --- */
  const fromCode = () => PRODUCTS.map(c => ({
    id: 'c:' + c.cat, he: c.cat, ar: c.ar || '',
    items: c.items.map(it => {
      const he = Array.isArray(it) ? it[0] : it, ar = Array.isArray(it) ? it[1] || '' : '';
      return { id: c.cat + '|' + he, he, ar };   // אותו מזהה כמו קודם – כדי שסימונים קיימים יישמרו
    }),
  }));
  let catalog;
  try {
    const saved = JSON.parse(store.get(CAT_KEY) || 'null');
    catalog = saved && saved.v === PRODUCTS_VERSION && Array.isArray(saved.cats) ? saved.cats : null;
  } catch { catalog = null; }
  let isEdited = !!catalog;            // האם אודי שינה את הרשימה (אז מציגים "חזרה לרשימה המקורית")
  if (!catalog) catalog = fromCode();
  const saveCatalog = () => { isEdited = true; store.set(CAT_KEY, JSON.stringify({ v: PRODUCTS_VERSION, cats: catalog })); };
  const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  /* --- סימונים --- */
  let marked;
  try { marked = new Set(JSON.parse(store.get(KEY) || '[]')); } catch { marked = new Set(); }
  const save = () => store.set(KEY, JSON.stringify([...marked]));
  function pruneMarks() {
    const valid = new Set(catalog.flatMap(c => c.items.map(i => i.id)));
    [...marked].forEach(id => valid.has(id) || marked.delete(id));
    save();
  }

  /* --- תאריך --- */
  const dateStr = (l = lang) => {
    const d = new Date();
    const day = d.toLocaleDateString(T[l].locale, { weekday: 'long' });
    const dd = String(d.getDate()).padStart(2, '0'), mm = String(d.getMonth() + 1).padStart(2, '0');
    return `${day}, ${dd}.${mm}.${d.getFullYear()}`;
  };

  /* ================= מסך המלאי ================= */
  function build() {
    const wrap = $('cats'); wrap.innerHTML = '';
    catalog.forEach(c => {
      if (!c.items.length) return;
      const sec = document.createElement('section'); sec.className = 'cat'; sec.dataset.cat = c.id;
      const h = document.createElement('h3'); h.innerHTML = '<b></b><span></span>'; h.firstChild.textContent = nm(c);
      const list = document.createElement('div'); list.className = 'list';
      c.items.forEach(item => {
        const b = document.createElement('button'); b.className = 'item'; b.type = 'button';
        b.dataset.id = item.id;
        b.innerHTML = `<span class="name"></span><span class="v" aria-hidden="true">${CHECK}</span>`;
        b.firstChild.textContent = nm(item);
        b.addEventListener('click', () => {
          marked.has(item.id) ? marked.delete(item.id) : marked.add(item.id);
          if (navigator.vibrate) navigator.vibrate(12);
          save(); refresh();
        });
        list.appendChild(b);
      });
      sec.append(h, list); wrap.appendChild(sec);
    });
    pruneMarks(); refresh();
  }

  function refresh() {
    document.querySelectorAll('.item').forEach(b => {
      const on = marked.has(b.dataset.id);
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    });
    document.querySelectorAll('#cats .cat').forEach(sec => {
      const c = catalog.find(x => x.id === sec.dataset.cat);
      const n = c ? c.items.filter(it => marked.has(it.id)).length : 0;
      sec.querySelector('h3 span').textContent = n ? t('missingN')(n) : '';
    });
    $('count').textContent = marked.size;
    $('send').classList.toggle('empty', marked.size === 0);
    $('clearAll').hidden = marked.size === 0;
    $('dateLine').textContent = dateStr();
  }

  /* --- הודעה לוואטסאפ --- */
  function message() {
    const ml = MESSAGE_LANG === 'auto' ? lang : (MESSAGE_LANG === 'ar' ? 'ar' : 'he');
    const lines = [`*${T[ml].msgTitle}* 🍕`, `📅 ${dateStr(ml)}`, ''];
    catalog.forEach(c => {
      const miss = c.items.filter(it => marked.has(it.id));
      if (!miss.length) return;
      lines.push(`*${nm(c, ml)}*`);
      miss.forEach(it => lines.push(`• ${nm(it, ml)}`));
      lines.push('');
    });
    lines.push(T[ml].msgTotal(marked.size));
    return lines.join('\n');
  }

  function toast(text) {
    document.querySelectorAll('.toast').forEach(x => x.remove());
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = text;
    document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
  }

  /* --- חלון שאלה כללי --- */
  let onYes = null;
  function ask(title, text, yes, no, fn) {
    $('askT').textContent = title; $('askP').textContent = text;
    $('askYes').textContent = yes; $('askNo').textContent = no;
    onYes = fn; $('ask').hidden = false; $('askYes').focus();
  }
  $('askYes').addEventListener('click', () => { $('ask').hidden = true; const f = onYes; onYes = null; f && f(); });
  $('askNo').addEventListener('click', () => { $('ask').hidden = true; onYes = null; });

  const clearMarks = () => { marked.clear(); save(); refresh(); toast(t('cleared')); window.scrollTo(0, 0); };

  // זוכרים שנשלחה הודעה – גם אם הדפדפן טוען את הדף מחדש בחזרה מוואטסאפ
  let waitingReturn = false;
  function askClear() {
    waitingReturn = false; store.del(SENT);
    if (marked.size) ask(t('sentT'), t('sentP'), t('yes'), t('no'), clearMarks);
  }

  $('send').addEventListener('click', () => {
    if (!marked.size) { toast(t('nothing')); return; }
    const num = String(DOR_WHATSAPP || '').replace(/\D/g, '');
    const url = `https://wa.me/${num}?text=${encodeURIComponent(message())}`;
    waitingReturn = true;
    store.set(SENT, Date.now());
    location.href = url;
    // אם הדף נשאר פתוח (למשל במחשב) – נשאל אחרי רגע
    setTimeout(() => { if (waitingReturn && document.visibilityState === 'visible') askClear(); }, 2500);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && waitingReturn) setTimeout(askClear, 300);
  });
  $('clearAll').addEventListener('click', () => ask(t('clearT'), t('clearP'), t('yes'), t('no'), clearMarks));

  /* ================= מסך עריכת הרשימה ================= */
  function buildEdit() {
    const wrap = $('edCats'); wrap.innerHTML = '';
    catalog.forEach(c => {
      const sec = document.createElement('section'); sec.className = 'cat';
      const h = document.createElement('h3');
      const hb = document.createElement('button'); hb.type = 'button'; hb.className = 'ed-cat';
      hb.innerHTML = '<span></span>' + PEN; hb.firstChild.textContent = nm(c);
      hb.addEventListener('click', () => openForm({ kind: 'cat', cat: c }));
      h.appendChild(hb);
      const list = document.createElement('div'); list.className = 'list';
      c.items.forEach(item => {
        const r = document.createElement('button'); r.type = 'button'; r.className = 'erow';
        r.innerHTML = '<span class="names"><span class="n1"></span><span class="n2"></span></span>' + PEN;
        r.querySelector('.n1').textContent = nm(item);
        const sec2 = item[other(lang)];
        const n2 = r.querySelector('.n2');
        n2.textContent = sec2 ? sec2 : t('noTr'); n2.classList.toggle('missing', !sec2);
        r.addEventListener('click', () => openForm({ kind: 'item', cat: c, item }));
        list.appendChild(r);
      });
      const add = document.createElement('button'); add.type = 'button'; add.className = 'erow add';
      add.innerHTML = '<span class="plus" aria-hidden="true">+</span><span></span>'; add.lastChild.textContent = t('addItem');
      add.addEventListener('click', () => openForm({ kind: 'item', cat: c }));
      list.appendChild(add);
      sec.append(h, list); wrap.appendChild(sec);
    });
    $('resetList').hidden = !isEdited;
  }

  /* --- חלון עריכה --- */
  let ctx = null, delArmed = false;
  function openForm(c) {
    ctx = c; delArmed = false;
    const obj = c.kind === 'cat' ? c.cat : c.item;
    const isNew = !obj;
    $('formT').textContent = t(c.kind === 'cat' ? (isNew ? 'newCat' : 'editCat') : (isNew ? 'newItem' : 'editItem'));
    $('inHe').value = obj ? obj.he : ''; $('inAr').value = obj ? obj.ar : '';
    $('formErr').hidden = true;
    const del = $('formDel'); del.hidden = isNew; del.classList.remove('sure');
    del.textContent = t(c.kind === 'cat' ? 'delCat' : 'delItem');
    // השדה של השפה שבחר – ראשון
    const [first, second] = lang === 'ar' ? ['inAr', 'inHe'] : ['inHe', 'inAr'];
    const form = $('formEl'); form.insertBefore($(first).parentNode, $(second).parentNode);
    $(first).setAttribute('enterkeyhint', 'next'); $(second).setAttribute('enterkeyhint', 'done');
    $('form').hidden = false;
    setTimeout(() => $(first).focus(), 50);
  }
  const closeForm = () => { $('form').hidden = true; ctx = null; };

  $('formEl').addEventListener('submit', e => {
    e.preventDefault();
    const he = $('inHe').value.trim(), ar = $('inAr').value.trim();
    if (!he && !ar) { $('formErr').hidden = false; return; }
    if (ctx.kind === 'cat') {
      if (ctx.cat) Object.assign(ctx.cat, { he, ar });
      else catalog.push({ id: newId('c'), he, ar, items: [] });
    } else {
      if (ctx.item) Object.assign(ctx.item, { he, ar });
      else ctx.cat.items.push({ id: newId('i'), he, ar });
    }
    commit(); closeForm(); toast(t('saved'));
  });
  // Enter בשדה הראשון עובר לשני
  ['inHe', 'inAr'].forEach(id => $(id).addEventListener('keydown', e => {
    if (e.key === 'Enter' && $(id).getAttribute('enterkeyhint') === 'next') {
      e.preventDefault(); $(id === 'inHe' ? 'inAr' : 'inHe').focus();
    }
  }));
  $('formDel').addEventListener('click', () => {
    if (!delArmed) { delArmed = true; $('formDel').classList.add('sure'); $('formDel').textContent = t('sure'); return; }
    if (ctx.kind === 'cat') catalog = catalog.filter(c => c !== ctx.cat);
    else ctx.cat.items = ctx.cat.items.filter(i => i !== ctx.item);
    commit(); closeForm(); toast(t('deleted'));
  });
  $('formCancel').addEventListener('click', closeForm);
  $('form').addEventListener('click', e => { if (e.target === $('form')) closeForm(); });

  function commit() { saveCatalog(); pruneMarks(); buildEdit(); build(); }

  $('addCat').addEventListener('click', () => openForm({ kind: 'cat' }));
  $('resetList').addEventListener('click', () => ask(t('resetT'), t('resetP'), t('resetYes'), t('resetNo'), () => {
    store.del(CAT_KEY); isEdited = false; catalog = fromCode(); pruneMarks(); buildEdit(); build(); toast(t('resetDone'));
  }));

  /* ================= מוזיקת רקע ================= */
  const MUSIC_KEY = 'p4p-music';
  let musicOn = store.get(MUSIC_KEY) !== 'off';
  let audio = null, unlocked = false;
  function ensureAudio() {
    if (audio || !MUSIC_URL) return audio;
    audio = new Audio(MUSIC_URL); audio.loop = true; audio.preload = 'auto'; audio.volume = 0;
    return audio;
  }
  function fadeTo(target, ms = 1200) {
    if (!audio) return;
    const from = audio.volume, t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / ms);
      try { audio.volume = from + (target - from) * k; } catch {}
      if (k < 1) requestAnimationFrame(step); else if (target === 0) audio.pause();
    };
    requestAnimationFrame(step);
  }
  function playMusic() {
    if (!musicOn || !ensureAudio()) return;
    const p = audio.play(); if (p && p.catch) p.catch(() => {});
    fadeTo(MUSIC_VOLUME, 1800);
  }
  const stopMusic = () => fadeTo(0, 500);
  function renderSound() {
    document.querySelectorAll('[data-sound-btn]').forEach(b => {
      b.classList.toggle('muted', !musicOn);
      b.setAttribute('aria-label', t(musicOn ? 'musicOn' : 'musicOff'));
      const l = b.querySelector('.snd-lbl'); if (l) l.textContent = t(musicOn ? 'musicOn' : 'musicOff');
    });
  }
  // הלחיצה הראשונה בדף "פותחת" את הסאונד
  const unlock = () => { if (unlocked) return; unlocked = true; playMusic(); };
  document.addEventListener('pointerdown', unlock, { capture: true });
  document.addEventListener('keydown', unlock, { capture: true });
  document.querySelectorAll('[data-sound-btn]').forEach(b => b.addEventListener('click', () => {
    musicOn = !musicOn; store.set(MUSIC_KEY, musicOn ? 'on' : 'off'); renderSound();
    musicOn ? playMusic() : stopMusic();
  }));
  // כשיוצאים מהאפליקציה (למשל לוואטסאפ) – המוזיקה נעצרת, וחוזרת כשחוזרים
  document.addEventListener('visibilitychange', () => {
    if (!audio) return;
    if (document.visibilityState === 'hidden') audio.pause(); else if (musicOn && unlocked) playMusic();
  });
  addEventListener('pagehide', () => { if (audio) audio.pause(); });

  /* ================= שפה ================= */
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('[data-lang-btn]').forEach(b => { b.textContent = t('langBtn'); b.setAttribute('aria-label', t('langBtnLabel')); });
    renderSound(); build(); buildEdit();
  }
  document.querySelectorAll('[data-lang-btn]').forEach(b => b.addEventListener('click', () => {
    lang = other(lang); store.set(LANG_KEY, lang); applyLang();
  }));

  /* ================= מעבר בין מסכים ================= */
  // #list = רשימת המלאי, #edit = עריכת הרשימה, בלי כלום = מסך פתיחה
  function show(screen) {
    const sp = $('splash');
    if (screen === 'splash') { sp.hidden = false; sp.classList.remove('out'); }
    else if (!sp.hidden) { sp.classList.add('out'); setTimeout(() => { sp.hidden = true; }, 350); }
    $('inv').hidden = screen !== 'list';
    $('edit').hidden = screen !== 'edit';
    if (screen !== 'splash') history.replaceState(null, '', '#' + screen);
    window.scrollTo(0, 0);
  }
  $('start').addEventListener('click', () => show('list'));
  $('openEdit').addEventListener('click', () => show('edit'));
  $('doneEdit').addEventListener('click', () => show('list'));

  addEventListener('hashchange', () => {
    if (location.hash === '#edit') show('edit'); else if (location.hash === '#list') show('list');
  });

  applyLang();
  if (location.hash === '#edit') { $('splash').hidden = true; show('edit'); }
  else if (location.hash === '#list') { $('splash').hidden = true; show('list'); }

  const sentAt = +store.get(SENT) || 0;
  if (sentAt && Date.now() - sentAt < 30 * 60 * 1000) {
    $('splash').hidden = true; show('list'); setTimeout(askClear, 300);
  } else if (sentAt) store.del(SENT);

  /* --- עבודה גם בלי אינטרנט --- */
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
</html>
