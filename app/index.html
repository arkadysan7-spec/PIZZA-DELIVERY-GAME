<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מה חסר? · Pizza For The People</title>
<meta name="theme-color" content="#10143a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מה חסר?">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Rubik:wght@400;500;700&family=Secular+One&display=swap">
<script>
/* ============================================================
   הגדרות – לעדכן כאן
   ============================================================ */

// מספר הוואטסאפ של דור, בפורמט בינלאומי בלי + ובלי מקפים (למשל '972501234567').
// כשהוא ריק – וואטסאפ ייפתח ואודי יבחר את דור מאנשי הקשר.
const DOR_WHATSAPP = '';

// באיזו שפה תצא ההודעה לדור בוואטסאפ: 'he' = תמיד עברית, 'ar' = תמיד ערבית,
// 'auto' = בשפה שאודי בחר באפליקציה.
const MESSAGE_LANG = 'he';

// ⚠️ רשימה זמנית לדוגמה! להחליף ברשימת המוצרים האמיתית של הפיצרייה.
// כל קטגוריה: שם בעברית, שם בערבית (ar), ורשימת מוצרים.
// כל מוצר: ['שם בעברית', 'الاسم بالعربي']. אם אין תרגום – אפשר לכתוב רק 'שם בעברית', והוא יוצג גם במצב ערבית.
// אפשר להוסיף, למחוק ולשנות סדר בחופשיות.
const PRODUCTS = [
  { cat: 'בצק וקמח', ar: 'عجين وطحين', items: [
    ['קמח 00', 'طحين 00'], ['סולת', 'سميد'], ['שמרים', 'خميرة'], ['מלח', 'ملح'], ['סוכר', 'سكر'], ['שמן זית', 'زيت زيتون'] ] },
  { cat: 'רטבים', ar: 'صلصات', items: [
    ['עגבניות מרוסקות', 'بندورة مطحونة'], ['רסק עגבניות', 'معجون بندورة'], ['פסטו', 'بيستو'], ['רוטב שום', 'صلصة ثوم'], ['רוטב חריף', 'صلصة حارّة'] ] },
  { cat: 'גבינות', ar: 'أجبان', items: [
    ['מוצרלה', 'موتزاريلا'], ['פרמזן', 'بارميزان'], ['גבינה כחולה', 'جبنة زرقاء'], ['ריקוטה', 'ريكوتا'], ['פטה', 'فيتا'] ] },
  { cat: 'תוספות', ar: 'إضافات', items: [
    ['פטריות', 'فطر'], ['זיתים שחורים', 'زيتون أسود'], ['זיתים ירוקים', 'زيتون أخضر'], ['בצל סגול', 'بصل أحمر'], ['פלפל חריף', 'فلفل حار'],
    ['תירס', 'ذرة'], ['עגבניות שרי', 'بندورة شيري'], ['בזיליקום טרי', 'ريحان طازة'], ['אורגנו', 'أوريغانو'], ['אנשובי', 'أنشوفة'] ] },
  { cat: 'אריזה', ar: 'تغليف', items: [
    ['קרטוני פיצה L', 'كراتين بيتسا L'], ['קרטוני פיצה M', 'كراتين بيتسا M'], ['קרטוני משולש', 'كراتين مثلث'], ['מפיות', 'محارم'], ['שקיות משלוח', 'أكياس توصيل'], ['כפפות', 'كفوف'] ] },
  { cat: 'שתייה', ar: 'مشروبات', items: [
    ['קולה', 'كولا'], ['קולה זירו', 'كولا زيرو'], ['ספרייט', 'سبرايت'], ['מים', 'مي'], ['בירה', 'بيرة'] ] },
  { cat: 'ניקיון', ar: 'تنظيف', items: [
    ['סבון כלים', 'سائل جلي'], ['נייר מגבת', 'ورق مطبخ'], ['שקיות זבל', 'أكياس زبالة'], ['חומר ניקוי', 'مواد تنظيف'], ['ספוגים', 'إسفنج'] ] },
];

// המשחק (דף נפרד בפרויקט)
const GAME_URL = 'ninja.html';

// תמונות
const IMG_LOGO  = 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KW2YTi9wKUIJMvG3be1a69csu3/2015f48a-e528-4ee4-a543-3893032d7ffd.png';
const IMG_CREW  = 'https://d8j0ntlcm91z4.cloudfront.net/user_3KW2YTi9wKUIJMvG3be1a69csu3/hf_20261105_143125_479264a5-8de2-48d2-a328-013d481c71bf.png';
</script>
<style>
  :root{
    --navy:#10143a;
    --navy-2:#171c4d;
    --navy-3:#222a66;
    --glow:#34408c;
    --yellow:#f4e04d;
    --yellow-d:#c9b52a;
    --ink:#f5f3ea;
    --muted:#a9addb;
    --red:#e2563f;
    --f-head:'Secular One','Lalezar','Rubik',system-ui,sans-serif; /* Lalezar = כותרות בערבית */
    --f-body:'Rubik',system-ui,-apple-system,sans-serif;
    --sat:env(safe-area-inset-top,0px);
    --sab:env(safe-area-inset-bottom,0px);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%}
  body{background:var(--navy);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-user-select:none;user-select:none}
  button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  /* ---------------- מסך פתיחה ---------------- */
  #splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
    padding:calc(var(--sat) + 28px) 24px calc(var(--sab) + 28px);text-align:center;overflow:hidden;
    background:var(--navy);transition:opacity .35s ease,transform .35s ease}
  #splash.out{opacity:0;transform:scale(1.03);pointer-events:none}
  .logo{width:min(46vw,190px);height:auto;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
  .tagline{margin-top:10px;font:700 13px/1 var(--f-body);letter-spacing:.24em;color:var(--yellow);direction:ltr;white-space:nowrap}
  .crew{position:relative;flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;margin-top:14px}
  .crew::before{content:"";position:absolute;left:50%;top:52%;width:min(120vw,560px);aspect-ratio:1;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(52,64,140,.95) 0%,rgba(52,64,140,.55) 35%,rgba(52,64,140,0) 68%);pointer-events:none}
  .crew img{position:relative;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
  #splash h1{margin:14px 0 0;font:400 clamp(40px,12vw,56px)/1.05 var(--f-head);color:#fff}
  #splash p{margin:10px 0 0;font:400 17px/1.45 var(--f-body);color:var(--muted)}
  .btn-yellow{display:block;width:100%;max-width:360px;margin:22px auto 0;padding:16px 20px 17px;border-radius:999px;
    background:var(--yellow);color:var(--navy);font:400 26px/1 var(--f-head);
    box-shadow:0 5px 0 var(--yellow-d),0 14px 30px rgba(244,224,77,.22);transition:transform .08s,box-shadow .08s}
  .btn-yellow:active{transform:translateY(4px);box-shadow:0 1px 0 var(--yellow-d),0 6px 14px rgba(244,224,77,.2)}
  .btn-yellow:disabled{opacity:.45}
  @media (max-height:640px){.logo{width:min(34vw,130px)}#splash h1{font-size:36px}#splash p{font-size:15px}.btn-yellow{margin-top:14px}}

  /* כפתור החלפת שפה */
  .btn-lang{flex:none;min-width:44px;height:40px;padding:0 12px;border-radius:999px;display:grid;place-items:center;
    background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.25);color:#fff;font:500 16px/1 var(--f-body)}
  .btn-lang:active{transform:scale(.95)}
  #splash .btn-lang{position:absolute;top:calc(var(--sat) + 14px);left:16px;z-index:2}

  /* ---------------- מסך המלאי ---------------- */
  #inv{min-height:100%;padding-bottom:calc(var(--sab) + 108px)}
  .top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--navy) 80%,rgba(16,20,58,0));
    padding:calc(var(--sat) + 12px) 12px 14px;display:flex;align-items:center;gap:8px}
  .top img{width:42px;height:42px;object-fit:contain;flex:none}
  .top .ttl{flex:1;min-width:0}
  .top h2{margin:0;font:400 26px/1.1 var(--f-head);color:#fff}
  .top h2,.top small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top small{display:block;margin-top:3px;font-size:13px;color:var(--muted)}
  .btn-ninja{flex:none;display:flex;align-items:center;gap:5px;padding:10px 12px;white-space:nowrap;border-radius:999px;
    background:var(--navy-3);border:1.5px solid rgba(244,224,77,.55);color:var(--yellow);font:400 16px/1 var(--f-head);text-decoration:none}
  .btn-ninja:active{transform:scale(.96)}
  .btn-ninja .l-short{display:none}
  /* מסכים צרים: מוותרים על הלוגו הקטן, ובצרים מאוד מקצרים את כפתור המשחק – כדי שהכותרת לא תיחתך */
  @media (max-width:420px){.top img{display:none}}
  @media (max-width:360px){.btn-ninja .l-full{display:none}.btn-ninja .l-short{display:inline}}

  .cat{margin:10px 12px 0}
  .cat h3{display:flex;justify-content:space-between;align-items:baseline;margin:14px 6px 8px;font:400 19px/1.2 var(--f-head);color:var(--yellow)}
  .cat h3 span{font:500 13px/1 var(--f-body);color:var(--muted)}
  .list{background:var(--navy-2);border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  .item{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:8px 16px 8px 10px;text-align:right;
    border-top:1px solid rgba(255,255,255,.06);transition:background .15s}
  .item:first-child{border-top:0}
  .item .name{flex:1;font:500 18px/1.3 var(--f-body)}
  .item .v{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
    border:2.5px solid rgba(255,255,255,.28);transition:background .15s,border-color .15s,transform .2s cubic-bezier(.3,1.6,.5,1)}
  .item .v svg{width:30px;height:30px;opacity:0;transform:scale(.4);transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.5,1)}
  .item.on{background:rgba(244,224,77,.1)}
  .item.on .name{color:var(--yellow)}
  .item.on .v{background:var(--yellow);border-color:var(--yellow)}
  .item.on .v svg{opacity:1;transform:none}
  .item:active .v{transform:scale(.9)}

  .clear-all{display:block;margin:26px auto 0;padding:10px 18px;color:var(--muted);font-size:15px;text-decoration:underline;text-underline-offset:3px}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:14px 16px calc(var(--sab) + 14px);
    background:linear-gradient(0deg,var(--navy) 70%,rgba(16,20,58,0))}
  .bar .btn-yellow{margin:0 auto;display:flex;justify-content:center;align-items:center;gap:10px}
  .bar .count{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:999px;background:var(--navy);color:var(--yellow);font:700 18px/1 var(--f-body)}

  /* ---------------- חלון שאלה + הודעה קצרה ---------------- */
  .modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:rgba(6,8,26,.7);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .2s ease}
  .sheet{width:100%;max-width:360px;background:var(--navy-2);border-radius:24px;padding:24px 20px 20px;text-align:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 20px 50px rgba(0,0,0,.5)}
  .sheet h4{margin:0;font:400 24px/1.2 var(--f-head);color:#fff}
  .sheet p{margin:8px 0 0;color:var(--muted);font-size:16px;line-height:1.45}
  .sheet .btn-yellow{margin-top:20px;font-size:22px;padding:14px}
  .btn-ghost{display:block;width:100%;margin-top:10px;padding:14px;border-radius:999px;font:500 17px/1 var(--f-body);color:var(--ink);background:rgba(255,255,255,.07)}
  .toast{position:fixed;left:50%;bottom:calc(var(--sab) + 110px);z-index:40;transform:translateX(-50%);padding:12px 18px;border-radius:999px;
    background:#fff;color:var(--navy);font:500 16px/1.2 var(--f-body);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:fade .2s ease;white-space:nowrap}
  @keyframes fade{from{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- מסך פתיחה -->
<section id="splash" aria-label="מסך פתיחה">
  <button class="btn-lang" data-lang-btn type="button"></button>
  <img class="logo" id="logo" alt="Pizza For The People">
  <div class="tagline">PIZZA FOR THE PEOPLE · JAFFA</div>
  <div class="crew"><img id="crew" alt="אודי ויאיר"></div>
  <h1 data-t="splashTitle">מה חסר היום?</h1>
  <p data-t="splashSub">מסמנים, שולחים לדור, וחוזרים לתנור</p>
  <button class="btn-yellow" id="start" data-t="start">מתחילים</button>
</section>

<!-- מסך המלאי -->
<main id="inv" hidden>
  <header class="top">
    <img id="logoSmall" alt="">
    <div class="ttl">
      <h2 data-t="invTitle">מה חסר?</h2>
      <small id="dateLine"></small>
    </div>
    <a class="btn-ninja" id="ninja">🍕 <span class="l-full" data-t="ninja">פיצה נינג'ה</span><span class="l-short" data-t="ninjaShort">נינג'ה</span></a>
    <button class="btn-lang" data-lang-btn type="button"></button>
  </header>
  <div id="cats"></div>
  <button class="clear-all" id="clearAll" hidden data-t="clearAll">ניקוי כל הסימונים</button>
  <div class="bar">
    <button class="btn-yellow" id="send"><span data-t="send">שלח לדור</span> <span class="count" id="count">0</span></button>
  </div>
</main>

<div class="modal" id="ask" hidden role="dialog" aria-modal="true" aria-labelledby="askT">
  <div class="sheet">
    <h4 id="askT">נשלח לדור?</h4>
    <p id="askP">לנקות את הסימונים ולהתחיל רשימה חדשה?</p>
    <button class="btn-yellow" id="askYes" data-t="yes">כן, לנקות</button>
    <button class="btn-ghost" id="askNo" data-t="no">לא, להשאיר</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'p4p-missing-v1';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#10143a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></svg>';

  /* --- תמונות --- */
  $('logo').src = IMG_LOGO; $('logoSmall').src = IMG_LOGO; $('crew').src = IMG_CREW;
  $('ninja').href = GAME_URL;
  // אם תמונה לא נטענת (אין קליטה) – מסתירים אותה במקום להציג אייקון שבור
  document.querySelectorAll('img').forEach(i => i.addEventListener('error', () => { i.style.visibility = 'hidden'; }));

  /* --- שפה: עברית / ערבית --- */
  const T = {
    he: {
      langBtn: 'عربي', langBtnLabel: 'التبديل إلى العربية',
      splashTitle: 'מה חסר היום?', splashSub: 'מסמנים, שולחים לדור, וחוזרים לתנור', start: 'מתחילים',
      invTitle: 'מה חסר?', ninja: "פיצה נינג'ה", ninjaShort: "נינג'ה", send: 'שלח לדור', clearAll: 'ניקוי כל הסימונים',
      missingN: n => `${n} חסרים`,
      sentT: 'נשלח לדור?', sentP: 'לנקות את הסימונים ולהתחיל רשימה חדשה?',
      clearT: 'לנקות הכל?', clearP: 'כל הסימונים יימחקו.',
      yes: 'כן, לנקות', no: 'לא, להשאיר',
      nothing: 'עוד לא סימנת שום דבר', cleared: 'נוקה! רשימה חדשה',
      msgTitle: 'מה חסר – Pizza For The People', msgTotal: n => `סה״כ ${n} פריטים`,
      locale: 'he-IL', title: 'מה חסר? · Pizza For The People',
    },
    ar: {
      langBtn: 'עברית', langBtnLabel: 'מעבר לעברית',
      splashTitle: 'شو ناقص اليوم؟', splashSub: 'بنعلّم، بنبعت لدور، وبنرجع عالفرن', start: 'يلّا نبلّش',
      invTitle: 'شو ناقص؟', ninja: 'بيتسا نينجا', ninjaShort: 'نينجا', send: 'ابعث لدور', clearAll: 'امسح كل العلامات',
      missingN: n => `ناقص ${n}`,
      sentT: 'انبعتت لدور؟', sentP: 'نمسح العلامات ونبلّش قائمة جديدة؟',
      clearT: 'نمسح كل إشي؟', clearP: 'كل العلامات رح تنمسح.',
      yes: 'آه، امسح', no: 'لا، خلّيها',
      nothing: 'لسّا ما علّمت ولا إشي', cleared: 'انمسحت! قائمة جديدة',
      msgTitle: 'شو ناقص – Pizza For The People', msgTotal: n => `المجموع ${n}`,
      locale: 'ar', title: 'شو ناقص؟ · Pizza For The People',
    },
  };
  const LANG_KEY = 'p4p-lang';
  let lang = 'he';
  try { if (localStorage.getItem(LANG_KEY) === 'ar') lang = 'ar'; } catch {}
  const t = k => T[lang][k];
  // שם של מוצר/קטגוריה בשפה הנבחרת (אם אין תרגום – עברית)
  const heName = it => Array.isArray(it) ? it[0] : it;
  const nameIn = (it, l) => Array.isArray(it) ? (l === 'ar' && it[1]) || it[0] : it;
  const catIn = (c, l) => (l === 'ar' && c.ar) || c.cat;
  let askMode = 'sent';

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('[data-lang-btn]').forEach(b => { b.textContent = t('langBtn'); b.setAttribute('aria-label', t('langBtnLabel')); });
    setAsk(askMode);
    build();
  }
  function setAsk(mode) {
    askMode = mode;
    $('askT').textContent = t(mode === 'clear' ? 'clearT' : 'sentT');
    $('askP').textContent = t(mode === 'clear' ? 'clearP' : 'sentP');
  }
  document.querySelectorAll('[data-lang-btn]').forEach(b => b.addEventListener('click', () => {
    lang = lang === 'he' ? 'ar' : 'he';
    try { localStorage.setItem(LANG_KEY, lang); } catch {}
    applyLang();
  }));

  /* --- שמירה בטלפון --- */
  const idOf = (cat, item) => cat + '|' + item;
  let marked;
  try { marked = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch { marked = new Set(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...marked])); } catch {} };

  /* --- תאריך --- */
  const dateStr = (l = lang) => {
    const d = new Date();
    const day = d.toLocaleDateString(T[l].locale, { weekday: 'long' });
    const dd = String(d.getDate()).padStart(2, '0'), mm = String(d.getMonth() + 1).padStart(2, '0');
    return `${day}, ${dd}.${mm}.${d.getFullYear()}`;
  };

  /* --- בניית הרשימה --- */
  function build() {
    const wrap = $('cats'); wrap.innerHTML = '';
    PRODUCTS.forEach(c => {
      const sec = document.createElement('section'); sec.className = 'cat';
      const h = document.createElement('h3'); h.innerHTML = `<b></b><span></span>`; h.firstChild.textContent = catIn(c, lang);
      const list = document.createElement('div'); list.className = 'list';
      c.items.forEach(item => {
        const b = document.createElement('button'); b.className = 'item'; b.type = 'button';
        b.dataset.id = idOf(c.cat, heName(item));
        b.innerHTML = `<span class="name"></span><span class="v" aria-hidden="true">${CHECK}</span>`;
        b.firstChild.textContent = nameIn(item, lang);
        b.addEventListener('click', () => {
          const id = b.dataset.id;
          marked.has(id) ? marked.delete(id) : marked.add(id);
          if (navigator.vibrate) navigator.vibrate(12);
          save(); refresh();
        });
        list.appendChild(b);
      });
      sec.append(h, list); wrap.appendChild(sec);
    });
    // מוחקים סימונים של מוצרים שכבר לא ברשימה
    const valid = new Set(PRODUCTS.flatMap(c => c.items.map(i => idOf(c.cat, heName(i)))));
    [...marked].forEach(id => valid.has(id) || marked.delete(id));
    save(); refresh();
  }

  function refresh() {
    document.querySelectorAll('.item').forEach(b => {
      const on = marked.has(b.dataset.id);
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    });
    document.querySelectorAll('.cat').forEach((sec, i) => {
      const { cat, items } = PRODUCTS[i];
      const n = items.filter(it => marked.has(idOf(cat, heName(it)))).length;
      sec.querySelector('h3 span').textContent = n ? t('missingN')(n) : '';
    });
    $('count').textContent = marked.size;
    $('clearAll').hidden = marked.size === 0;
    $('dateLine').textContent = dateStr();
  }

  /* --- הודעה לוואטסאפ --- */
  function message() {
    const ml = MESSAGE_LANG === 'auto' ? lang : (MESSAGE_LANG === 'ar' ? 'ar' : 'he');
    const lines = [`*${T[ml].msgTitle}* 🍕`, `📅 ${dateStr(ml)}`, ''];
    PRODUCTS.forEach(c => {
      const miss = c.items.filter(it => marked.has(idOf(c.cat, heName(it))));
      if (!miss.length) return;
      lines.push(`*${catIn(c, ml)}*`);
      miss.forEach(it => lines.push(`• ${nameIn(it, ml)}`));
      lines.push('');
    });
    lines.push(T[ml].msgTotal(marked.size));
    return lines.join('\n');
  }

  function toast(t) {
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = t;
    document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
  }

  // זוכרים שנשלחה הודעה – גם אם הדפדפן טוען את הדף מחדש בחזרה מוואטסאפ
  const SENT = 'p4p-sent-at';
  let waitingReturn = false;
  function askClear() {
    waitingReturn = false; try { localStorage.removeItem(SENT); } catch {}
    if (marked.size) { setAsk('sent'); $('ask').hidden = false; $('askYes').focus(); }
  }

  $('send').addEventListener('click', () => {
    if (!marked.size) { toast(t('nothing')); return; }
    const num = String(DOR_WHATSAPP || '').replace(/\D/g, '');
    const url = `https://wa.me/${num}?text=${encodeURIComponent(message())}`;
    waitingReturn = true;
    try { localStorage.setItem(SENT, Date.now()); } catch {}
    location.href = url;
    // אם הדף נשאר פתוח (למשל במחשב) – נשאל אחרי רגע
    setTimeout(() => { if (waitingReturn && document.visibilityState === 'visible') askClear(); }, 2500);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && waitingReturn) setTimeout(askClear, 300);
  });
  $('askYes').addEventListener('click', () => { marked.clear(); save(); refresh(); $('ask').hidden = true; toast(t('cleared')); window.scrollTo(0, 0); });
  $('askNo').addEventListener('click', () => { $('ask').hidden = true; });
  $('clearAll').addEventListener('click', () => { setAsk('clear'); $('ask').hidden = false; });

  /* --- מעבר בין מסכים --- */
  function showInv() {
    $('splash').classList.add('out');
    $('inv').hidden = false;
    setTimeout(() => { $('splash').hidden = true; }, 350);
    history.replaceState(null, '', '#list');
  }
  $('start').addEventListener('click', showInv);
  if (location.hash === '#list') { $('splash').hidden = true; $('inv').hidden = false; }

  applyLang();

  let sentAt = 0; try { sentAt = +localStorage.getItem(SENT) || 0; } catch {}
  if (sentAt && Date.now() - sentAt < 30 * 60 * 1000) {
    $('splash').hidden = true; $('inv').hidden = false; setTimeout(askClear, 300);
  } else if (sentAt) { try { localStorage.removeItem(SENT); } catch {} }

  /* --- עבודה גם בלי אינטרנט --- */
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
</html>
