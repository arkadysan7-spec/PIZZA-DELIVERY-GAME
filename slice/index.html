<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>פיצה סלאש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* מיתוג Pizza 4 The People: אדום בורדו, צהוב בצק, דיו חום, קרם, קרפט */
  :root{ color-scheme:dark; --red:#b3261e; --red-d:#7e1812; --yel:#f4e04d; --ink:#2a1210; --cream:#fff6dc; --kraft:#c8b08a;
         --display:'Secular One','Rubik',system-ui,sans-serif; --body:'Rubik',system-ui,sans-serif; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#1c0f08; font-family:var(--body); color:var(--cream);
    -webkit-user-select:none; user-select:none; touch-action:none; -webkit-tap-highlight-color:transparent; }
  canvas{ display:block; position:fixed; inset:0; width:100%; height:100%; }
  #ui{ touch-action:none; cursor:crosshair; }
  .overlay{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    gap:10px; padding:max(4vh,20px) 16px 0; box-sizing:border-box; pointer-events:none; text-align:center; transition:opacity .35s; }
  .overlay.hidden{ opacity:0; }
  .overlay.hidden *{ pointer-events:none !important; }
  .logo{ width:clamp(84px,18vh,140px); height:auto; aspect-ratio:1; border-radius:50%; border:4px solid var(--ink);
    box-shadow:0 6px 0 var(--ink), 0 12px 30px rgba(0,0,0,.5); animation:spin 18s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .brand{ font:700 clamp(12px,2.2vw,15px) var(--body); letter-spacing:.2em; color:var(--yel); direction:ltr; }
  h1{ margin:0; font:400 clamp(48px,12vw,104px)/.95 var(--display); color:var(--yel);
    -webkit-text-stroke:clamp(3px,.6vw,5px) var(--ink); paint-order:stroke fill; text-shadow:0 6px 0 var(--red), 0 12px 26px rgba(0,0,0,.55); text-wrap:balance; }
  .sub{ font:700 clamp(15px,3.3vw,22px)/1.35 var(--body); text-shadow:0 2px 8px rgba(0,0,0,.8); max-width:26em; }
  .chip{ padding:6px 16px; border-radius:999px; background:var(--red); color:var(--yel); border:3px solid var(--ink);
    font:900 clamp(14px,3vw,18px) var(--body); box-shadow:0 4px 0 var(--ink); }
  .hint{ position:fixed; bottom:max(5vh,24px); left:0; right:0; font:700 clamp(15px,3.2vw,20px) var(--body); color:var(--cream);
    animation:pulse 1.4s ease-in-out infinite; text-shadow:0 2px 8px rgba(0,0,0,.9); }
  @keyframes pulse{ 50%{ opacity:.35; } }
  .big{ font:400 clamp(64px,16vw,130px)/1 var(--display); color:var(--yel); -webkit-text-stroke:5px var(--ink); paint-order:stroke fill;
    text-shadow:0 6px 0 var(--red); }
  .btn{ pointer-events:auto; margin-top:10px; padding:12px 30px; font:400 clamp(20px,4vw,28px) var(--display); color:var(--yel);
    background:var(--red); border:4px solid var(--ink); border-radius:16px; box-shadow:0 6px 0 var(--ink); cursor:pointer; }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .btn:focus-visible, #mute:focus-visible{ outline:3px solid var(--yel); outline-offset:3px; }
  #mute{ position:fixed; left:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); width:44px; height:44px; border-radius:50%;
    border:3px solid var(--ink); background:var(--cream); font-size:20px; cursor:pointer; z-index:5; padding:0; line-height:38px; }
  #loading{ position:fixed; inset:0; display:grid; place-items:center; font:700 18px var(--body); color:var(--yel); }
  @media (prefers-reduced-motion: reduce){ .hint,.logo{ animation:none; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<div id="loading">טוען את המטבח…</div>

<div id="menu" class="overlay hidden">
  <img class="logo" id="menuLogo" alt="הלוגו של Pizza 4 The People">
  <div class="brand">PIZZA 4 THE PEOPLE</div>
  <h1>פיצה סלאש</h1>
  <div class="sub">חותכים רק את התוספות שבהזמנה, והן נוחתות על הפיצה</div>
  <div class="chip" id="pizzaChip">🌽 תירס צ'ילי 🌶️</div>
  <div class="hint">חתכו את התירס כדי להתחיל</div>
</div>

<div id="over" class="overlay hidden">
  <img class="logo" id="overLogo" alt="">
  <div class="sub" id="overTitle">המשמרת נגמרה!</div>
  <div class="big" id="overScore">0</div>
  <div class="sub" id="overPizzas">פיצות שיצאו: 0</div>
  <div class="sub" id="overBest">שיא: 0</div>
  <button class="btn" id="again">עוד משמרת</button>
</div>

<button id="mute" aria-label="השתק">🔊</button>

function canvasTex(w, h, draw, repeat, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function seeded(s) { return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

function woodPlanks(c, w, h, vertical, tones, plankCount) {
  const n = plankCount, pw = (vertical ? w : h) / n;
  for (let i = 0; i < n; i++) {
    c.fillStyle = tones[i % tones.length];
    vertical ? c.fillRect(i * pw, 0, pw, h) : c.fillRect(0, i * pw, w, pw);
    c.strokeStyle = 'rgba(25,10,3,.28)';
    for (let g = 0; g < 14; g++) {
      c.lineWidth = rand(.8, 2.4); c.beginPath();
      const o = i * pw + rand(4, pw - 4);
      for (let s = 0; s <= (vertical ? h : w); s += 24) {
        const wob = Math.sin(s * .012 + g * 1.7) * 4;
        vertical ? (s ? c.lineTo(o + wob, s) : c.moveTo(o + wob, s)) : (s ? c.lineTo(s, o + wob) : c.moveTo(s, o + wob));
      }
      c.stroke();
    }
    c.fillStyle = 'rgba(15,6,2,.75)';
    vertical ? c.fillRect(i * pw - 2, 0, 4, h) : c.fillRect(0, i * pw - 2, w, 4);
  }
}

function drawPizzaBase(c, R, rnd, withCrust = true) {

addEventListener('resize', layout);

/* ---------- הזמנות ---------- */
function newOrder() {

  let total = 0; for (const k in need) { got[k] = 0; total += need[k]; }
  const timeMax = 14 + total * 1.6 - Math.min(orderNo, 8) * .6;
  order = { need, got, time: timeMax, timeMax, done: false };
  disposePizza(pizza); pizza = makePizza(); pizza.x = -xHalf * 2.6; pizza.group.position.x = pizza.x;
  spawnT = 1;
}
const orderComplete = () => Object.keys(order.need).every(k => order.got[k] >= order.need[k]);
function finishOrder(ok) {

  if (ok) {
    pizzasDone++; const bonus = 10 + orderNo * 2 + Math.ceil(order.time); score += bonus;
    popups.push({ x: W / 2, y: H * .45, text: `הזמנה מוכנה! +${bonus}`, t: 0, color: YEL, big: true, life: 1.6 }); SFX.done();
  } else loseLife('ההזמנה התקררה…');
}
function loseLife(msg) {

  popups.push({ x: W / 2, y: H * .42, text: msg, t: 0, color: '#ff6a55', big: true, life: 1.4 });
  if (lives <= 0) setTimeout(gameOver, 700);
}

function clearWorld() {

  items = []; halves = []; flying = []; parts = []; splats = []; popups = [];
}
function showMenu() {

  $('menu').classList.remove('hidden'); $('over').classList.add('hidden');
  const it = spawnItem('corn', 0, ndcToZ0(0, -.22).y); it.menu = true; it.vel.set(0, 0, 0);
}
function startGame() {

  $('menu').classList.add('hidden'); $('over').classList.add('hidden');

}
function gameOver() {

  $('overScore').textContent = score; $('overPizzas').textContent = 'פיצות שיצאו: ' + pizzasDone;

$('again').addEventListener('click', () => { ensureAudio(); startGame(); });
$('mute').addEventListener('click', e => { muted = !muted; e.currentTarget.textContent = muted ? '🔇' : '🔊'; ensureAudio(); });

/* ---------- תוספות נופלות ---------- */
function spawnItem(kind, x, y) {
  const mesh = BUILD[kind]();
  mesh.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
  mesh.position.set(x, y, 0);
  mesh.rotation.set(rand(0, TAU), rand(0, TAU), rand(0, TAU));
  scene.add(mesh);
  const it = { kind, mesh, vel: new THREE.Vector3(rand(-.4, .4), -rand(.5, 1.6), 0),
    spin: new THREE.Vector3(rand(-2, 2), rand(-2, 2), rand(-2, 2)), r: ITEMS[kind].r, state: 'fall', t: 0, sx: 0, sy: 0, sr: 0, scale: 1 };
  items.push(it); return it;
}
function spawnOne() {
  const need = order.need, wanted = Object.keys(need).filter(k => order.got[k] < need[k]);
  const wrongKinds = Object.keys(ITEMS).filter(k => !(k in need));
  const kind = Math.random() < CFG.RELEVANT_CHANCE ? pick(wanted.length ? wanted : Object.keys(need)) : pick(wrongKinds);
  spawnItem(kind, rand(-xHalf * .8, xHalf * .8), topY + 1);
}

/* ---------- חיתוך ---------- */
const Z = new THREE.Vector3(0, 0, 1);
function makeHalf(it, nWorld, side) {
  const mesh = it.mesh.clone(true);
  const qInv = it.mesh.quaternion.clone().invert();
  const nLocal = nWorld.clone().applyQuaternion(qInv).multiplyScalar(side);
  const plane = new THREE.Plane();
  mesh.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.clippingPlanes = [plane]; o.material.transparent = true; o.castShadow = true; } });
  const capMat = new THREE.MeshStandardMaterial({ map: CROSS[it.kind], roughness: .55, transparent: true, side: THREE.DoubleSide });
  const cap = new THREE.Mesh(new THREE.CircleGeometry(ITEMS[it.kind].cap, 32), capMat);
  cap.quaternion.setFromUnitVectors(Z, nLocal.clone().negate());
  mesh.add(cap);
  scene.add(mesh);
  return { mesh, plane, local: new THREE.Plane(nLocal, 0), t: 0,
    vel: it.vel.clone().multiplyScalar(.4).add(nWorld.clone().multiplyScalar(side * 2.6)).add(new THREE.Vector3(0, 1.2, rand(.2, .8))),
    spin: new THREE.Vector3(rand(-4, 4), rand(-4, 4), rand(-4, 4)) };
}

function randomSpotOnPizza() {
  const a = rand(0, TAU), d = Math.sqrt(Math.random()) * PZ * .74;
  return { x: Math.cos(a) * d, z: Math.sin(a) * d };
}

function sliceItem(it, sdx, sdy) {
  it.dead = true; scene.remove(it.mesh);
  const def = ITEMS[it.kind];
  const nWorld = new THREE.Vector3(sdy, sdx, 0).normalize();
  halves.push(makeHalf(it, nWorld, 1), makeHalf(it, nWorld, -1));
  // מיץ
  for (let i = 0; i < 16; i++) { const a = rand(0, TAU), v = rand(it.sr * 2, it.sr * 7);
    parts.push({ x: it.sx, y: it.sy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - it.sr * 2, s: it.sr * rand(.05, .13), life: rand(.35, .7), t: 0, color: def.juice }); }
  const blobs = []; for (let i = 0; i < 7; i++) blobs.push({ dx: rand(-1, 1) * it.sr, dy: rand(-1, 1) * it.sr, r: it.sr * rand(.15, .4) });
  splats.push({ x: it.sx, y: it.sy, blobs, color: def.juice, t: 0 });
  SFX.slice();
  if (it.menu) { setTimeout(startGame, 500); return; }
  // החתיכות עפות אל הפיצה
  const relevant = it.kind in order.need, n = randi(def.pieces[0], def.pieces[1]);
  for (let i = 0; i < n; i++) {
    const m = PIECE_BUILD[def.piece](); m.traverse(o => { if (o.isMesh) o.castShadow = true; });
    m.position.copy(it.mesh.position); scene.add(m);
    const spot = randomSpotOnPizza(), T = rand(.45, .7), gP = 16;
    const target = new THREE.Vector3(pizza.group.position.x + spot.x, PIZZA_TOP, spot.z);
    const vel = target.clone().sub(m.position).multiplyScalar(1 / T); vel.y += .5 * gP * T;
    flying.push({ mesh: m, vel, gP, t: 0, T, spot, pizza, wrong: !relevant, spin: new THREE.Vector3(rand(-9, 9), rand(-9, 9), rand(-9, 9)) });
  }
  if (order.done) return;
  if (relevant) {
    order.got[it.kind]++;
    const over = order.got[it.kind] > order.need[it.kind];
    if (!over) score += 1;
    popups.push({ x: it.sx, y: it.sy - it.sr, text: over ? 'מספיק ' + def.name + '!' : '+1', t: 0, color: over ? '#ffe9b0' : '#fff', life: .8 });
    if (orderComplete()) setTimeout(() => { if (order && !order.done && state === 'play') finishOrder(true); }, 750);
  } else {
    SFX.wrong();
    popups.push({ x: it.sx, y: it.sy - it.sr, text: '✕ ' + def.name + ' לא בהזמנה!', t: 0, color: '#ff6a55', life: 1.1 });
    loseLife('אוי, ' + def.name + ' על הפיצה!');
  }
}

/* ---------- קלט ---------- */
let pointerDown = false, last = null, lastSwish = 0;
const pos = e => ({ x: e.clientX, y: e.clientY, t: performance.now() / 1000 });
ui.addEventListener('pointerdown', e => { ensureAudio(); pointerDown = true; last = pos(e); blade = [last]; try { ui.setPointerCapture(e.pointerId); } catch (_) {} });
ui.addEventListener('pointermove', e => {
  if (!pointerDown) return;
  let evs = e.getCoalescedEvents ? e.getCoalescedEvents().map(pos) : []; if (!evs.length) evs = [pos(e)];
  for (const q of evs) { handleSegment(last, q); last = q; blade.push(q); }
});

ui.addEventListener('pointerup', up); ui.addEventListener('pointercancel', up); ui.addEventListener('pointerleave', up);

  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy; let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = clamp(t, 0, 1);
  return Math.hypot(ax + t * dx - px, ay + t * dy - py);
}

  if (state !== 'play' && state !== 'menu') return;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy); if (len < 3) return;
  const speed = len / Math.max(b.t - a.t, 1 / 240), ref = Math.min(W, H) * .06;
  if (speed < ref * 4) return;

  for (const it of items) {

    if (segDist(it.sx, it.sy, a.x, a.y, b.x, b.y) < it.sr) sliceItem(it, dx / len, dy / len);
  }
}

/* ---------- לולאה ---------- */
let prevT = performance.now(), clock = 0;
function frame(now) {
  const dt = Math.min((now - prevT) / 1000, 1 / 30); prevT = now; clock += dt;
  update(dt); renderer.render(scene, camera); draw2D();
  requestAnimationFrame(frame);
}

function update(dt) {
  const lvl = Math.min(orderNo, 10), G = 6.5 + lvl * .45;

  if (state === 'play' && order && pizza) {
    if (pizza.phase === 'in') { pizza.t += dt; const k = Math.min(pizza.t / .5, 1); pizza.x = -xHalf * 2.6 * Math.pow(1 - k, 3); if (k >= 1) pizza.phase = 'ready'; }
    if (pizza.phase === 'ready' && !order.done) {
      order.time -= dt; if (order.time <= 0) { order.time = 0; finishOrder(false); }
      spawnT -= dt;
      if (spawnT <= 0) {
        spawnOne();
        if (Math.random() < Math.min(.45, orderNo * .06)) setTimeout(() => state === 'play' && order && !order.done && spawnOne(), 180);
        spawnT = Math.max(.45, 1.05 - orderNo * .06) * rand(.8, 1.2);
      }
    }
    if (pizza.phase === 'out') { pizza.t += dt; pizza.x = xHalf * 2.6 * Math.pow(Math.min(pizza.t / .55, 1), 2); if (pizza.t >= .7 && lives > 0) newOrder(); }
  }
  if (pizza) {
    pizza.group.position.x = pizza.x;
    for (const l of pizza.landed) { l.t += dt; const s = l.t < .15 ? 1 + (1 - l.t / .15) * .6 : 1; l.mesh.scale.setScalar(s); }
  }

  const px = pizza ? pizza.group.position.x : 0;
  for (const it of items) {
    const m = it.mesh;
    if (it.menu) { m.position.y = ndcToZ0(0, -.22).y + Math.sin(clock * 2) * .15; m.rotation.y += dt * .8; m.rotation.x = .3; }
    else {
      it.vel.y -= G * dt; m.position.addScaledVector(it.vel, dt);
      m.rotation.x += it.spin.x * dt; m.rotation.y += it.spin.y * dt; m.rotation.z += it.spin.z * dt;
      if (Math.abs(m.position.x) > xHalf) { m.position.x = Math.sign(m.position.x) * xHalf; if (it.state === 'fall') it.vel.x *= -1; }
      if (it.state === 'fall' && it.vel.y < 0 && Math.abs(m.position.x - px) < PZ * 1.05 && m.position.y - it.r * .55 < PIZZA_TOP) {
        it.state = 'bounced'; it.vel.set((m.position.x < px ? -1 : 1) * rand(3, 5), Math.abs(it.vel.y) * .3 + 2, rand(.3, .9)); it.spin.multiplyScalar(2); SFX.bounce();
      }
      if (m.position.y - it.r * .5 < TABLE_Y && it.vel.y < 0) {
        if (it.state !== 'table') { it.state = 'table'; it.t = 0; }
        m.position.y = TABLE_Y + it.r * .5; it.vel.y = Math.abs(it.vel.y) * .25; it.vel.x *= .7; it.vel.z *= .7;
      }
      if (it.state === 'table') { it.t += dt; if (it.t > .6) { it.scale -= dt * 3; m.scale.setScalar(Math.max(it.scale, .01)); if (it.scale <= 0) it.dead = true; } }
      if (m.position.y < TABLE_Y - 3) it.dead = true;
    }
    const sp = toScreen(m.position, {}); it.sx = sp.x; it.sy = sp.y; it.sr = screenRadius(m.position, it.r);
    if (it.dead) scene.remove(m);
  }
  items = items.filter(i => !i.dead);

  for (const h of halves) {
    h.t += dt; h.vel.y -= G * dt; h.mesh.position.addScaledVector(h.vel, dt);
    h.mesh.rotation.x += h.spin.x * dt; h.mesh.rotation.y += h.spin.y * dt; h.mesh.rotation.z += h.spin.z * dt;
    if (h.mesh.position.y < TABLE_Y + .25 && h.vel.y < 0) { h.mesh.position.y = TABLE_Y + .25; h.vel.y = Math.abs(h.vel.y) * .3; h.vel.x *= .6; h.spin.multiplyScalar(.5); }
    h.mesh.updateMatrixWorld(true); h.plane.copy(h.local).applyMatrix4(h.mesh.matrixWorld);
    if (h.t > .9) { const o = Math.max(0, 1 - (h.t - .9) / .5); h.mesh.traverse(n => { if (n.isMesh) n.material.opacity = o; }); }
    if (h.t > 1.4) { h.dead = true; scene.remove(h.mesh); }
  }
  halves = halves.filter(h => !h.dead);

  for (const f of flying) {
    f.t += dt; f.vel.y -= f.gP * dt; f.mesh.position.addScaledVector(f.vel, dt);
    f.mesh.rotation.x += f.spin.x * dt; f.mesh.rotation.y += f.spin.y * dt; f.mesh.rotation.z += f.spin.z * dt;
    if (f.t >= f.T) {
      f.done = true; scene.remove(f.mesh);
      if (f.pizza === pizza && pizza.phase !== 'out') {
        f.mesh.position.set(f.spot.x, 0, f.spot.z); f.mesh.rotation.set(0, rand(0, TAU), 0);
        f.mesh.traverse(o => { if (o.isMesh) o.receiveShadow = true; });
        pizza.tops.add(f.mesh); pizza.landed.push({ mesh: f.mesh, t: 0 });
        if (Math.random() < .35) SFX.land();
      }
    }
  }
  flying = flying.filter(f => !f.done);

  for (const p of parts) { p.t += dt; p.vy += H * 1.6 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.t < p.life);
  for (const s of splats) s.t += dt; splats = splats.filter(s => s.t < 1.3);
  for (const p of popups) p.t += dt; popups = popups.filter(p => p.t < p.life);
  const tnow = performance.now() / 1000; blade = blade.filter(p => tnow - p.t < CFG.BLADE_LIFE);
  shake = Math.max(0, shake - dt * 2); flash = Math.max(0, flash - dt * 1.5);
  camera.position.x = shake > 0 ? rand(-1, 1) * shake * .12 : 0;
}

/* ---------- שכבת דו-ממד: להב, מיץ, ממשק ---------- */
function outlined(txt, x, y, size, color, font = 'Rubik', weight = 900) {
  g2.font = `${weight} ${size}px ${font}, Rubik, sans-serif`; g2.lineJoin = 'round';
  g2.lineWidth = size * .18; g2.strokeStyle = INK; g2.strokeText(txt, x, y); g2.fillStyle = color; g2.fillText(txt, x, y);
}
function draw2D() {

    g2.globalAlpha = clamp(1 - s.t / 1.3, 0, 1) * .55; g2.fillStyle = s.color;
    for (const b of s.blobs) { g2.beginPath(); g2.arc(s.x + b.dx, s.y + b.dy, b.r, 0, TAU); g2.fill(); }
  }
  for (const p of parts) { g2.globalAlpha = clamp(1 - p.t / p.life, 0, 1); g2.fillStyle = p.color; g2.beginPath(); g2.arc(p.x, p.y, p.s, 0, TAU); g2.fill(); }

}

  g2.setLineDash([4, 5]); g2.lineWidth = 1.5; g2.strokeStyle = 'rgba(42,18,16,.3)';
  g2.beginPath(); g2.moveTo(x + 10, y + th * .44); g2.lineTo(right, y + th * .44); g2.stroke(); g2.setLineDash([]);
  const rowY = y + th * .68, cellW = (right - x - 12) / keys.length;
  keys.forEach((k, i) => {
    const cx = right - cellW * i - cellW / 2, def = ITEMS[k], got = Math.min(order.got[k], order.need[k]), ok = got >= order.need[k];
    g2.save(); g2.translate(cx + cellW * .25, rowY); (PIECE_ICON[def.piece] || PIECE_ICON.kernel)(g2, th * .13); g2.restore();
    g2.direction = 'ltr'; g2.textAlign = 'right'; g2.font = `900 ${fs * 1.05}px Rubik, sans-serif`; g2.fillStyle = ok ? '#2f8a3c' : INK;
    g2.fillText(ok ? `✓ ${got}/${order.need[k]}` : `${got}/${order.need[k]}`, cx + cellW * .08, rowY + 1);
  });
  const k = clamp(order.time / order.timeMax, 0, 1);
  g2.fillStyle = 'rgba(42,18,16,.12)'; g2.fillRect(x + 8, y + th - 7, tw - 16, 3);
  g2.fillStyle = k > .35 ? '#2f8a3c' : RED; g2.fillRect(x + tw - 8 - (tw - 16) * k, y + th - 7, (tw - 16) * k, 3);
}

/* ---------- התחלה ---------- */
layout();
$('loading').remove();
showMenu();
requestAnimationFrame(frame);
</script>
